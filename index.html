<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>卫戍协议：盟约</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#101820;color:#dce8ee;font:16px system-ui,sans-serif}iframe{border:0;display:none;width:100%;height:100dvh}main{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}.card{max-width:520px;line-height:1.7}h1{font-size:28px}button{background:#aadeec;border:0;padding:12px 24px;border-radius:6px;color:#10232b;font:inherit;cursor:pointer}small{display:block;color:#93a6af;margin-top:24px}a{color:#aadeec}details{position:fixed;right:8px;bottom:8px;z-index:10;background:#101820ed;border:1px solid #496775;border-radius:8px;max-width:min(420px,90vw);padding:8px 12px;font-size:12px;line-height:1.8}summary{cursor:pointer;color:#aadeec}details p{margin:8px 0}
</style>
<main id="status"><div class="card"><h1>卫戍协议：盟约</h1><p id="message">正在连接游戏服务器…</p><button id="retry" type="button">重新连接</button><small>1–4 人合作 · 可添加 AI 队友<br>原作者：<a href="https://github.com/sganggs" target="_blank" rel="noopener noreferrer">sganggs</a><br>非官方同人，素材版权归鹰角 / Yostar，禁止盈利。<br><a href="https://github.com/sganggs/Stronghold-Protocol" target="_blank" rel="noopener noreferrer">原作与开源项目</a></small></div></main>
<iframe id="game" title="卫戍协议：盟约" allow="fullscreen; autoplay; clipboard-write" allowfullscreen></iframe>
<details><summary>原作者与版权说明</summary><p>游戏原作者：<a href="https://github.com/sganggs" target="_blank" rel="noopener noreferrer">sganggs</a><br>原项目：<a href="https://github.com/sganggs/Stronghold-Protocol" target="_blank" rel="noopener noreferrer">Stronghold-Protocol</a> · 版本 0.1.2<br>本网站为个人部署的联机入口，与原作者及官方无隶属关系。<br>非官方同人。素材版权归鹰角 / Yostar 等原权利人。禁止盈利，仅供个人非商业使用。<br>原项目代码使用 GPL-3.0-or-later；游戏素材不适用该代码许可证。完整声明见<a href="https://github.com/sganggs/Stronghold-Protocol/blob/main/NOTICE.md" target="_blank" rel="noopener noreferrer">原项目 NOTICE</a>。</p></details>
<script>
const statusView=document.getElementById('status'),message=document.getElementById('message'),game=document.getElementById('game');
let pending=false,timer;
async function connect(){
  if(pending)return;pending=true;clearTimeout(timer);message.textContent='正在连接游戏服务器…';
  try{
    const endpoint=new URL('https://raw.githubusercontent.com/liuzunrong/stronghold-game/main/server.json');
    endpoint.searchParams.set('v',Date.now().toString());
    const response=await fetch(endpoint,{cache:'no-store',signal:AbortSignal.timeout(15000)});
    if(!response.ok)throw new Error('offline');
    const data=await response.json(),url=new URL(data.url);
    if(url.protocol!=='https:'||!/^[-a-z0-9]+\.trycloudflare\.com$/.test(url.hostname)||url.pathname!=='/')throw new Error('invalid');
    game.src=url.href;game.style.display='block';statusView.style.display='none';
  }catch(error){message.textContent='游戏服务器暂未连接。请让房主在电脑上运行“启动公网联机.cmd”。本页将在 10 秒后重试。';timer=setTimeout(connect,10000);}
  finally{pending=false;}
}
document.getElementById('retry').addEventListener('click',connect);connect();
</script>
</html>
